version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    # Security alerts and automated security fixes remain enabled at repository level.
    # Android toolchain upgrades are handled as deliberate, fully tested migrations.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
